plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mydialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mydialer"
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
